name: CI Android

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifica-web:
    name: Verifica sorgenti web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Controllo sintassi e struttura
        run: node scripts/check-web.mjs

  build-apk:
    name: Build APK (debug)
    needs: verifica-web
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - name: Valida Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Prepara Android SDK (gia' presente sul runner)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Compila
        run: ./gradlew --no-daemon assembleDebug

      - name: Nome APK con versione e commit
        id: apk
        run: |
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          NAME="console-operativa-${VERSION}-${GITHUB_SHA::7}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Pubblica APK
        uses: actions/upload-artifact@v4
        with:
          name: console-operativa-apk
          path: android/${{ steps.apk.outputs.name }}
          retention-days: 90
          if-no-files-found: error
