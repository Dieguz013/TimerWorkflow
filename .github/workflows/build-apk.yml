name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Genera progetto Android
        run: |
          set -e
          if [ ! -f console-fasi.html ]; then
            echo "ERRORE: manca console-fasi.html nella radice del repository"
            exit 1
          fi
          P=android-app
          mkdir -p $P/app/src/main/assets
          mkdir -p $P/app/src/main/java/com/consoleoperativa/fasi
          mkdir -p $P/app/src/main/res/values
          mkdir -p $P/app/src/main/res/mipmap-anydpi-v26
          mkdir -p $P/app/src/main/res/drawable
          cp console-fasi.html $P/app/src/main/assets/index.html

          cat > $P/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ConsoleOperativa"
          include(":app")
          EOF

          cat > $P/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
          }
          EOF

          cat > $P/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.nonTransitiveRClass=true
          EOF

          cat > $P/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
          }

          android {
              namespace = "com.consoleoperativa.fasi"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.consoleoperativa.fasi"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          EOF

          cat > $P/app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="Console Operativa"
                  android:theme="@style/AppTheme"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|keyboardHidden|keyboard|density|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > $P/app/src/main/java/com/consoleoperativa/fasi/MainActivity.java <<'EOF'
          package com.consoleoperativa.fasi;

          import android.app.Activity;
          import android.graphics.Color;
          import android.os.Bundle;
          import android.view.WindowManager;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {

              private WebView web;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  // Schermo sempre acceso finche' l'app e' in primo piano
                  getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
                  getWindow().setStatusBarColor(Color.parseColor("#141A22"));
                  getWindow().setNavigationBarColor(Color.parseColor("#0C1016"));

                  web = new WebView(this);
                  web.setBackgroundColor(Color.parseColor("#0C1016"));

                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);

                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);

                  if (savedInstanceState != null) {
                      web.restoreState(savedInstanceState);
                  } else {
                      web.loadUrl("file:///android_asset/index.html");
                  }
              }

              @Override
              protected void onSaveInstanceState(Bundle outState) {
                  super.onSaveInstanceState(outState);
                  web.saveState(outState);
              }

              // Tasto indietro = minimizza, cosi' la sessione non si perde per errore
              @Override
              public void onBackPressed() {
                  moveTaskToBack(true);
              }

              @Override
              protected void onDestroy() {
                  if (web != null) {
                      web.destroy();
                  }
                  super.onDestroy();
              }
          }
          EOF

          cat > $P/app/src/main/res/values/themes.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="app_bg">#0C1016</color>
              <color name="ic_bg">#141A22</color>
              <style name="AppTheme" parent="android:Theme.DeviceDefault.NoActionBar">
                  <item name="android:windowBackground">@color/app_bg</item>
                  <item name="android:statusBarColor">#141A22</item>
                  <item name="android:navigationBarColor">#0C1016</item>
              </style>
          </resources>
          EOF

          cat > $P/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_bg" />
              <foreground android:drawable="@drawable/ic_fg" />
          </adaptive-icon>
          EOF

          cat > $P/app/src/main/res/drawable/ic_fg.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:pathData="M54,34 A22,22 0 1,1 54,78 A22,22 0 1,1 54,34 Z"
                  android:fillColor="#00000000"
                  android:strokeColor="#E3A23D"
                  android:strokeWidth="5"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M48,25 L60,25"
                  android:strokeColor="#E3A23D"
                  android:strokeWidth="5"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M54,56 L54,44"
                  android:strokeColor="#4FC3D9"
                  android:strokeWidth="4"
                  android:strokeLineCap="round" />
              <path
                  android:pathData="M54,56 L63,62"
                  android:strokeColor="#4FC3D9"
                  android:strokeWidth="4"
                  android:strokeLineCap="round" />
          </vector>
          EOF

      - name: Compila APK
        run: gradle -p android-app assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: console-operativa-apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk
